title = "SELinux for Developers and Administrators"
subtitle = "Security as code: from one denial to a reviewed module in production"
edition = "First edition"
description = "A hands-on SELinux manual for application developers and RHEL administrators: read an AVC, write policy, test it offline, review it like code, and ship it without turning SELinux off."
repo = "https://github.com/anurag-saran/selinux-pac"
branch = "main"
site_url = "https://anurag-saran.github.io/selinux-pac"

