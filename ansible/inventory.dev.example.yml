# QA RHEL box (policy discovery). Filename inventory.dev.yml is legacy.
# Copy to ansible/inventory.dev.yml (gitignored) or generate with:
#   bash lab/setup_rhel_hosts.sh write --qa-host HOST --prod-host HOST
#
# Run Ansible from a controller (laptop or AAP). The demo app is installed
# on the host with: sudo bash lab/demo_bootstrap.sh --shopapi-only
#
# Controller-only: policy_artifact_dir, policy_pp_src (compiled .pp on this machine).
# On rhel-qa (clone path): selinux_ops_dir, app_manifest_path.
# playbook_dir is the laptop/AAP path — do not use it for those two.

all:
  hosts:
    rhel-qa:
      ansible_host: rhel-qa.example.com
      ansible_user: ansible
      ansible_become: true
      ansible_python_interpreter: /usr/bin/python3
  vars:
    app_name: shopapi
    domain: shopapi_t
    install_root: /opt/shopapi
    var_dir: /var/lib/shopapi
    log_dir: /var/log/shopapi
    runtime_dir: /run/shopapi
    service_name: shopapi.service
    selinux_ops_from_package: false
    selinux_ops_dir: /home/ansible/selinux-pac/scripts
    policy_artifact_dir: "{{ playbook_dir }}/.."
    policy_pp_src: "{{ policy_artifact_dir }}/selinux/shopapi/shopapi.pp"
    app_manifest_path: /home/ansible/selinux-pac/config/shopapi.manifest.yml
    ansible_env_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    soak_marker_file: "/var/lib/selinux-policy-ops/{{ app_name }}/selinux_canary_deployed_at"
    soak_min_days: 0
    soak_max_avc: 0
    soak_max_net_new: 0
    soak_use_net_new: true
    http_probe_host: "127.0.0.1"
    selinux_pac_host_role: qa
