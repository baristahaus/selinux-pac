---
# app_manifest_path is a TARGET path (ops scripts --manifest). When Ansible
# runs from a laptop, that path is not playbook_dir. If the inventory still
# points at the controller checkout, load from localhost and copy onto the host.

- name: Stat app manifest on target
  ansible.builtin.stat:
    path: "{{ app_manifest_path }}"
  register: pac_manifest_stat_target

- name: Stat app manifest on controller (inventory path)
  ansible.builtin.stat:
    path: "{{ app_manifest_path }}"
  register: pac_manifest_stat_ctrl
  delegate_to: localhost
  become: false
  when: not pac_manifest_stat_target.stat.exists

- name: Stat app manifest in controller checkout
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../config/{{ app_name }}.manifest.yml"
  register: pac_manifest_stat_ctrl_rel
  delegate_to: localhost
  become: false
  when:
    - not pac_manifest_stat_target.stat.exists
    - not (pac_manifest_stat_ctrl.stat.exists | default(false))

- name: Fail when app manifest missing on target and controller
  ansible.builtin.fail:
    msg: >-
      App manifest not found on the target at {{ app_manifest_path }}
      or on the controller checkout
      ({{ playbook_dir }}/../config/{{ app_name }}.manifest.yml).
      For a laptop controller, set app_manifest_path to a path ON the RHEL host
      (clone: /home/{{ ansible_user }}/selinux-pac/config/{{ app_name }}.manifest.yml;
      RPM: /etc/{{ app_name }}/selinux-manifest.yml).
      Do not set it from playbook_dir.
  when:
    - not pac_manifest_stat_target.stat.exists
    - not (pac_manifest_stat_ctrl.stat.exists | default(false))
    - not (pac_manifest_stat_ctrl_rel.stat.exists | default(false))

- name: Record manifest source
  ansible.builtin.set_fact:
    pac_manifest_from_controller: "{{ not pac_manifest_stat_target.stat.exists }}"
    pac_manifest_src: >-
      {{
        app_manifest_path if pac_manifest_stat_target.stat.exists
        else (
          app_manifest_path
          if (pac_manifest_stat_ctrl.stat.exists | default(false))
          else (playbook_dir ~ '/../config/' ~ app_name ~ '.manifest.yml')
        )
      }}

- name: Read app manifest from target
  ansible.builtin.slurp:
    src: "{{ pac_manifest_src }}"
  register: pac_manifest_slurp
  when: not (pac_manifest_from_controller | bool)

- name: Read app manifest from controller
  ansible.builtin.slurp:
    src: "{{ pac_manifest_src }}"
  register: pac_manifest_slurp_ctrl
  delegate_to: localhost
  become: false
  when: pac_manifest_from_controller | bool

- name: Parse app manifest YAML
  ansible.builtin.set_fact:
    pac_manifest: "{{ (pac_manifest_slurp_ctrl if (pac_manifest_from_controller | bool) else pac_manifest_slurp).content | b64decode | from_yaml }}"

- name: Choose target dest when manifest was loaded from the controller
  ansible.builtin.set_fact:
    app_manifest_path: >-
      {{
        app_manifest_path
        if app_manifest_path is match('^/(etc|home|opt|usr|var)/')
        else ('/etc/' ~ pac_manifest.app_name ~ '/selinux-manifest.yml')
      }}
  when: pac_manifest_from_controller | bool

- name: Ensure manifest parent directory exists on target
  ansible.builtin.file:
    path: "{{ app_manifest_path | dirname }}"
    state: directory
    mode: "0755"
  when: pac_manifest_from_controller | bool

- name: Copy app manifest onto target
  ansible.builtin.copy:
    src: "{{ pac_manifest_src }}"
    dest: "{{ app_manifest_path }}"
    mode: "0644"
  when: pac_manifest_from_controller | bool

- name: Apply manifest-driven application facts
  ansible.builtin.set_fact:
    app_name: "{{ pac_manifest.app_name }}"
    domain: "{{ pac_manifest.domain }}"
    install_root: "{{ pac_manifest.paths.install_root }}"
    var_dir: "{{ pac_manifest.paths.var_dir }}"
    log_dir: "{{ pac_manifest.paths.log_dir | default('/var/log/' ~ pac_manifest.app_name) }}"
    runtime_dir: "{{ pac_manifest.paths.runtime_dir | default('/run/' ~ pac_manifest.app_name) }}"
    service_name: "{{ pac_manifest.services.primary.unit }}"
    http_probe_host: "{{ pac_manifest.http.host | default(http_probe_host) }}"
    soak_marker_file: "{{ pac_manifest.deploy.soak_marker_file | default('/var/lib/selinux-policy-ops/' ~ pac_manifest.app_name ~ '/selinux_canary_deployed_at') }}"
    selinux_ports_list: "{{ pac_manifest.selinux_ports | default([]) }}"
    selinux_booleans_list: "{{ pac_manifest.selinux_booleans | default([]) }}"

- name: Build selinux_ports_list from http when manifest omits selinux_ports
  ansible.builtin.set_fact:
    selinux_ports_list: >-
      {{
        [{'port': pac_manifest.http.port, 'proto': 'tcp', 'type': pac_manifest.app_name ~ '_port_t'}]
        + (
          [{'port': pac_manifest.http.backend.port, 'proto': 'tcp', 'type': pac_manifest.app_name ~ '_backend_port_t'}]
          if pac_manifest.services.backend is defined and pac_manifest.http.backend is defined
          else []
        )
      }}
  when: selinux_ports_list | length == 0

- name: Build service unit restart list from manifest
  ansible.builtin.set_fact:
    selinux_pac_service_units: >-
      {{
        ([pac_manifest.services.backend.unit] if pac_manifest.services.backend is defined else [])
        + [pac_manifest.services.primary.unit]
      }}
