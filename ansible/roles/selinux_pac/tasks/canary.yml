---
- name: Detect semanage availability
  ansible.builtin.stat:
    path: /usr/sbin/semanage
  register: semanage_bin

- name: Require semanage for the canary
  ansible.builtin.fail:
    msg: >-
      semanage is not installed. Canary will not load a permissive overlay
      (that path made init_t permissive while getenforce stayed Enforcing).
      Install policycoreutils-python-utils.
  when: not semanage_bin.stat.exists

- name: Require policy_pp_src when not installing from RPM
  ansible.builtin.fail:
    msg: >-
      Set policy_pp_src to the controller path of the compiled .pp
      (or enable selinux_ops_from_package).
  when:
    - not (selinux_ops_from_package | bool)
    - policy_pp_src | default('') | length == 0

- name: Stat policy module on controller
  ansible.builtin.stat:
    path: "{{ policy_pp_src }}"
  register: pp_src_stat
  delegate_to: localhost
  become: false
  when:
    - not (selinux_ops_from_package | bool)
    - policy_pp_src | default('') | length > 0

- name: Fail when staged policy missing on controller
  ansible.builtin.fail:
    msg: "Build policy first: bash scripts/compile_and_validate.sh {{ pac_manifest.policy.module_dir | default('selinux') }}"
  when:
    - not (selinux_ops_from_package | bool)
    - policy_pp_src | default('') | length > 0
    - not pp_src_stat.stat.exists

- name: Import package install and staging tasks
  ansible.builtin.import_tasks: install_packages.yml

- block:
    - name: Disable dontaudit rules during canary soak
      ansible.builtin.command: semodule -DB
      register: semodule_db
      changed_when: semodule_db.rc == 0

    - name: Read current SELinux port assignments
      ansible.builtin.command: semanage port -l
      register: semanage_port_list
      changed_when: false
      when:
        - semanage_bin.stat.exists
        - selinux_ports_list | length > 0

    - name: Register manifest ports without taking one another type owns
      ansible.builtin.shell: |
        set -euo pipefail
        action="$(printf '%s\n' "$PORT_LIST" | python3 "{{ selinux_ops_dir }}/lib/app_manifest.py" check-port --port "{{ item.port }}" --proto "{{ item.proto | default('tcp') }}" --type "{{ item.type }}")"
        printf '%s\n' "${action}"
        if [[ "${action}" == "add" ]]; then
          semanage port -a -t "{{ item.type }}" -p "{{ item.proto | default('tcp') }}" "{{ item.port }}"
        fi
      environment:
        PORT_LIST: "{{ semanage_port_list.stdout | default('') }}"
      loop: "{{ selinux_ports_list }}"
      when:
        - semanage_bin.stat.exists
        - selinux_ports_list | length > 0
      register: port_register
      changed_when: port_register.stdout is search('^add')

    - name: Enable permissive domain for canary
      community.general.selinux_permissive:
        name: "{{ domain }}"
        permissive: true
      when: semanage_bin.stat.exists

    - name: Apply manifest SELinux booleans before the service starts
      ansible.posix.seboolean:
        name: "{{ item.name }}"
        state: "{{ item.state | bool }}"
        persistent: "{{ item.persistent | default(true) | bool }}"
      loop: "{{ selinux_booleans_list | default([]) }}"
      when: (selinux_booleans_list | default([])) | length > 0

    - name: Ensure persistent application directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_run_user | default(app_name) }}"
        group: "{{ app_run_group | default(app_name) }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ var_dir }}", mode: "0750" }
        - { path: "{{ log_dir }}", mode: "0750" }

    - name: Restore file contexts on persistent application paths
      ansible.builtin.command: >-
        restorecon -Rv {{ install_root }} {{ var_dir }} {{ log_dir }}
      register: restorecon_persistent
      changed_when: restorecon_persistent.rc == 0

    - name: Verify file contexts before service restart
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/verify_file_contexts.sh
        --install-root {{ install_root }}
        --var-dir {{ var_dir }}
        --log-dir {{ log_dir }}
        --app-name {{ app_name }}
        --pre-service-restart
      changed_when: false

    - name: Create root-owned soak state directory
      ansible.builtin.file:
        path: "{{ soak_marker_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Record canary deploy timestamp for soak gate
      ansible.builtin.shell: |
        date +%s > "{{ soak_marker_file }}"
        chown root:root "{{ soak_marker_file }}"
        chmod 0644 "{{ soak_marker_file }}"
        auditctl -s | awk '/^lost / { print $2 }' > "{{ soak_marker_file }}.audit_lost"
        chown root:root "{{ soak_marker_file }}.audit_lost"
        chmod 0644 "{{ soak_marker_file }}.audit_lost"
      changed_when: true

    - name: Reset systemd failure counters before service restart
      ansible.builtin.command: "systemctl reset-failed {{ selinux_pac_service_units | join(' ') }}"
      changed_when: false
      failed_when: false

    # shopapi_t is already permissive. This restart is the first start in that
    # domain. The policy RPM %post must not systemctl restart; that would
    # start the service enforcing before this task.
    - name: Restart application services via systemd
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: "{{ selinux_pac_service_units }}"

    - name: Restore file contexts on runtime directory after service start
      ansible.builtin.command: "restorecon -Rv {{ runtime_dir }}"
      register: restorecon_run
      changed_when: restorecon_run.rc == 0

    - name: Wait for all endpoints (unified canary smoke)
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/wait_for_endpoints.sh
        --manifest {{ app_manifest_path }}
        --host {{ http_probe_host }} --retries 15 --delay 2
      changed_when: false

    - name: Check for new domain AVC events (recent window)
      ansible.builtin.shell: |
        set -o pipefail
        {{ selinux_ops_dir }}/monitor_avc.sh \
          --manifest {{ app_manifest_path }} \
          --marker-file {{ soak_marker_file }} \
          --max-avc -1 \
          --max-net-new -1 \
          --show-lines 0 \
          --format json
      register: avc_json
      changed_when: false

    - name: Parse canary AVC counts
      ansible.builtin.set_fact:
        avc_count: "{{ (avc_json.stdout | from_json).count | default(0) }}"
        avc_net_new_count: "{{ (avc_json.stdout | from_json).net_new_count | default(-1) }}"
        avc_fail_closed: "{{ (avc_json.stdout | from_json).avc_fail_closed | default(true) }}"

    - name: Fail when canary AVC monitor failed closed
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/check_soak_gate.sh
        --fail-closed {{ avc_fail_closed | bool | ternary('true', 'false') }}
        --net-new {{ avc_net_new_count }}
      changed_when: false

    - name: Fail when canary raw AVC count exceeds threshold
      ansible.builtin.fail:
        msg: >-
          Canary AVC count {{ avc_count }} exceeds threshold
          {{ canary_max_avc | default(0) }}.
      when: avc_count | int > (canary_max_avc | default(0) | int)

    - name: Fail when canary net-new AVC needs exceed threshold
      ansible.builtin.fail:
        msg: >-
          Canary net-new access needs {{ avc_net_new_count }} exceeds threshold
          {{ canary_max_net_new | default(0) }}.
      when:
        - avc_net_new_count | int >= 0
        - avc_net_new_count | int > (canary_max_net_new | default(0) | int)

    - name: Write canary deploy report
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/post_deploy_report.sh
        --phase canary
        --domain {{ domain }}
        --var-dir {{ var_dir }}
        --manifest {{ app_manifest_path }}
        --marker-file {{ soak_marker_file }}
        --policy-version {{ policy_version }}
      register: deploy_report
      changed_when: deploy_report.rc == 0
      failed_when: deploy_report.rc != 0

    - name: Report canary status
      ansible.builtin.debug:
        msg: >-
          Recent {{ domain }} events: {{ avc_count }} raw,
          {{ avc_net_new_count }} net-new (thresholds {{ canary_max_avc | default(0) }} /
          {{ canary_max_net_new | default(0) }}).
          Deploy report: {{ pac_manifest.deploy.deploy_report_file | default('/var/lib/selinux-policy-ops/' ~ app_name ~ '/selinux_deploy_report.json') }}.

  rescue:
    - name: Restore dontaudit baseline after failed canary
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/semodule_restore_dontaudit.sh --app {{ app_name }}
      changed_when: true

    - name: Canary deploy failed
      ansible.builtin.fail:
        msg: >-
          Canary deploy failed. dontaudit was restored unless another app is still soaking.
          Inspect AVCs and deploy report if present.
