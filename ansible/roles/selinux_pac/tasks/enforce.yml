---
- name: Require change ticket for enforce
  ansible.builtin.fail:
    msg: >-
      change_ticket is required for enforce (AAP survey or
      -e change_ticket=CHG123). force_enforce=true still needs a ticket.
  when: (change_ticket | default('') | trim | length) == 0

- name: Require a reason for break-glass enforce
  ansible.builtin.fail:
    msg: >-
      force_enforce=true skips the marker, the AVC gate, net-new, the report,
      the day count, and the daily history. Pass
      -e break_glass_reason='why this cannot wait for the soak'.
  when:
    - force_enforce | default(false) | bool
    - (break_glass_reason | default('') | trim | length) == 0

- name: Refuse lab soak window on production group
  ansible.builtin.fail:
    msg: >-
      soak_min_days={{ soak_min_days | default(7) }} is below 7 on a host in
      group 'production'. That value is lab-only (inventory.dev.yml).
      Do not copy it onto prod.
  when:
    - "'production' in group_names"
    - (soak_min_days | default(7) | int) < 7

- name: Fail closed unless auditd is recording since the marker
  ansible.builtin.command: >
    {{ selinux_ops_dir }}/check_audit_health.sh {{ soak_marker_file }}
  changed_when: false
  when: not (force_enforce | default(false) | bool)

- name: Collect soak gate facts on target
  ansible.builtin.command: >
    {{ selinux_ops_dir }}/collect_soak_facts.sh
    --domain {{ domain }}
    --manifest {{ app_manifest_path }}
    --marker-file {{ soak_marker_file }}
    --report-file {{ pac_manifest.deploy.deploy_report_file | default('/var/lib/selinux-policy-ops/' ~ app_name ~ '/selinux_deploy_report.json') }}
    --var-dir {{ var_dir }}
  register: soak_facts_raw
  changed_when: false
  when: not (force_enforce | default(false) | bool)

- name: Parse soak facts
  ansible.builtin.set_fact:
    soak_facts: "{{ soak_facts_raw.stdout | from_json }}"
  when: not (force_enforce | default(false) | bool)

- name: Fail when canary marker missing
  ansible.builtin.fail:
    msg: "Canary marker missing — run deploy_canary first"
  when:
    - not (force_enforce | default(false) | bool)
    - soak_facts.marker_exists | int == 0

- name: Fail when soak period not met
  ansible.builtin.fail:
    msg: >-
      Soak not met: {{ soak_facts.days_elapsed }} day(s) elapsed;
      need {{ soak_min_days | default(7) }}.
  when:
    - not (force_enforce | default(false) | bool)
    - not (skip_soak_days | default(false) | bool)
    - soak_facts.days_elapsed | int < (soak_min_days | default(7) | int)

- name: Fail when soak AVC monitor failed closed
  ansible.builtin.command: >
    {{ selinux_ops_dir }}/check_soak_gate.sh
    --fail-closed {{ soak_facts.avc_fail_closed | bool | ternary('true', 'false') }}
    --net-new {{ soak_facts.avc_net_new_count }}
  changed_when: false
  when: not (force_enforce | default(false) | bool)

- name: Require consecutive passing daily soak results
  ansible.builtin.command: >
    {{ selinux_ops_dir }}/check_soak_days.sh
    --state-dir {{ soak_marker_file | dirname }}
    --min-days {{ soak_min_days | default(7) }}
    --max-net-new {{ soak_max_net_new | default(0) }}
  changed_when: false
  when:
    - not (force_enforce | default(false) | bool)
    - not (skip_soak_days | default(false) | bool)

- name: Fail when net-new AVC needs too high
  ansible.builtin.fail:
    msg: >-
      Too many net-new access needs since marker: {{ soak_facts.avc_net_new_count }}
      (max {{ soak_max_net_new | default(0) }}).
  when:
    - not (force_enforce | default(false) | bool)
    - soak_use_net_new | default(true) | bool
    - not (soak_facts.avc_fail_closed | default(false) | bool)
    - soak_facts.avc_net_new_count | int > (soak_max_net_new | default(0) | int)

- name: Fail when raw AVC count too high
  ansible.builtin.fail:
    msg: >-
      Too many AVCs since marker: {{ soak_facts.avc_count_since_marker }}
      (max {{ soak_max_avc | default(0) }}).
  when:
    - not (force_enforce | default(false) | bool)
    - not (soak_use_net_new | default(true) | bool)
    - soak_facts.avc_count_since_marker | int > (soak_max_avc | default(0) | int)

- name: Fail when deploy report gate not satisfied
  ansible.builtin.fail:
    msg: "Deploy report failed soak gate (status={{ soak_facts.report_status }})"
  when:
    - not (force_enforce | default(false) | bool)
    - not soak_facts.report_gate_ok | bool

- name: Break-glass enforce override active
  ansible.builtin.debug:
    msg: "force_enforce=true — skipping soak gate (document approval in change ticket)"
  when: force_enforce | default(false) | bool

- name: Re-enable dontaudit baseline before enforce
  ansible.builtin.command: >
    {{ selinux_ops_dir }}/semodule_restore_dontaudit.sh --app {{ app_name }}
  register: semodule_b_enforce
  changed_when: "'skip semodule -B' not in (semodule_b_enforce.stderr | default(''))"

- name: Detect semanage availability
  ansible.builtin.stat:
    path: /usr/sbin/semanage
  register: semanage_bin

- block:
    - name: Remove permissive flag from domain
      community.general.selinux_permissive:
        name: "{{ domain }}"
        permissive: false
      when: semanage_bin.stat.exists

    - name: Verify SELinux enforcing mode
      ansible.builtin.command: getenforce
      register: selinux_mode
      changed_when: false
      failed_when: selinux_mode.stdout != "Enforcing"

    - name: Ensure persistent application directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_run_user | default(app_name) }}"
        group: "{{ app_run_group | default(app_name) }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ var_dir }}", mode: "0750" }
        - { path: "{{ log_dir }}", mode: "0750" }

    - name: Restore file contexts on persistent application paths
      ansible.builtin.command: >-
        restorecon -Rv {{ install_root }} {{ var_dir }} {{ log_dir }}
      register: restorecon_enforce
      changed_when: restorecon_enforce.rc == 0

    - name: Verify file contexts before service restart
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/verify_file_contexts.sh
        --install-root {{ install_root }}
        --var-dir {{ var_dir }}
        --log-dir {{ log_dir }}
        --app-name {{ app_name }}
      changed_when: false

    - name: Restart services under enforcing policy via systemd
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ selinux_pac_service_units }}"

    - name: Restore file contexts on runtime directory after service start
      ansible.builtin.command: "restorecon -Rv {{ runtime_dir }}"
      register: restorecon_run_enforce
      changed_when: restorecon_run_enforce.rc == 0

    - name: Production smoke tests (unified endpoint wait)
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/wait_for_endpoints.sh
        --manifest {{ app_manifest_path }}
        --host {{ http_probe_host }} --retries 15 --delay 2
        {{ '' if semanage_bin.stat.exists else '--skip-domain-check' }}
      changed_when: false

    - name: Write enforce deploy report
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/post_deploy_report.sh
        --phase enforce
        --domain {{ domain }}
        --var-dir {{ var_dir }}
        --manifest {{ app_manifest_path }}
        --marker-file {{ soak_marker_file }}
        --policy-version {{ policy_version }}
        {{ '--force-enforce' if (force_enforce | default(false) | bool) else '' }}
        {{ '--skip-soak-days' if (skip_soak_days | default(false) | bool) else '' }}
      environment:
        BREAK_GLASS_REASON: "{{ break_glass_reason | default('') if (force_enforce | default(false) | bool) else '' }}"
      register: deploy_report
      changed_when: deploy_report.rc == 0
      failed_when: deploy_report.rc != 0

    - name: Archive this app's canary marker after enforce
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/semodule_restore_dontaudit.sh
        --app {{ app_name }} --archive
      register: archived_marker
      changed_when: "'archived ' in (archived_marker.stdout | default(''))"

  rescue:
    - name: Auto-rescue — restore permissive domain after enforce failure
      community.general.selinux_permissive:
        name: "{{ domain }}"
        permissive: true
      when: semanage_bin.stat.exists

    - name: Auto-rescue — restart services after enforce failure
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ selinux_pac_service_units }}"

    - name: Auto-rescue — verify endpoints after rollback to permissive
      ansible.builtin.command: >
        {{ selinux_ops_dir }}/wait_for_endpoints.sh
        --manifest {{ app_manifest_path }}
        --host {{ http_probe_host }} --retries 10 --delay 2
        {{ '' if semanage_bin.stat.exists else '--skip-domain-check' }}
      changed_when: false

    - name: Enforce failed — domain reverted to permissive
      ansible.builtin.fail:
        msg: >-
          Enforce failed; {{ domain }} restored to permissive.
          Inspect deploy report at {{ pac_manifest.deploy.deploy_report_file | default('/var/lib/selinux-policy-ops/' ~ app_name ~ '/selinux_deploy_report.json') }}.
