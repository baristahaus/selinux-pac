# shopapi — Spring Boot demo reference (generation pipeline)
#
# Paths and port come from systemd EnvironmentFile written from
# config/shopapi.manifest.yml. Do not add literals here for the demo host.

app_name: shopapi
domain: shopapi_t

paths:
  install_root: /opt/shopapi
  var_dir: /var/lib/shopapi
  log_dir: /var/log/shopapi
  runtime_dir: /run/shopapi
  # Outage path. Not in the types-only .fc; generate adds it from /feature-spool AVCs.
  extra_fc_roots:
    - /var/spool/shopapi

services:
  primary:
    unit: shopapi.service
    domain: shopapi_t

http:
  host: 127.0.0.1
  port: 8091
  endpoints:
    - /health
    - /state
    - /log

selinux_ports:
  - port: 8091
    proto: tcp
    type: shopapi_port_t

# Reviewed exceptions to the house rules. A code owner approves each reason.
# exec_bin lets the generator write corecmd_exec_bin(shopapi_t) and lets CI
# accept execute on bin_t. Nothing else unlocks it.
selinux_exceptions:
  exec_bin: >-
    The wrapper execs the system JVM from java-17-openjdk-headless. On RHEL 9
    that file is bin_t: java_exec_t is an alias of bin_t in the base
    corecommands module, so no narrower type exists. corecmd_exec_bin is the
    rule Red Hat's own tomcat policy uses. Programs started this way stay in
    shopapi_t. The JVM keeps its dnf security updates.

policy:
  module_dir: selinux/shopapi
  service_name: shopapi.service

deploy:
  soak_marker_file: /var/lib/selinux-policy-ops/shopapi/selinux_canary_deployed_at
  deploy_report_file: /var/lib/selinux-policy-ops/shopapi/selinux_deploy_report.json

# Canary disables dontaudit. These denials still appear and are not allows:
# passwd_file_t is refused, cgroup_t is omitted (undeclared type).
soak:
  ignore:
    - tclass: file
      target_type: passwd_file_t
    - tclass: filesystem
      target_type: cgroup_t
    - tclass: dir
      target_type: cgroup_t
    - tclass: file
      target_type: cgroup_t
